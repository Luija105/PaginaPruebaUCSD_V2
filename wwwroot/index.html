<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PaginaPruebaUCSD_V2</title>
    <base href="/PaginaPruebaUCSD_V2/" />

    <!-- Script seguro de redirección para GitHub Pages SPA -->
    <script type="text/javascript">
                (function(l) {
                    if (l.search && l.search.length > 1 && l.search[1] === '/') {
                        var decoded = l.search.slice(1).split('&').map(function(s) {
                            return s.replace(/~and~/g, '&');
                        }).join('?');
                        window.history.replaceState(null, null,
                            l.pathname.slice(0, -1) + decoded + l.hash
                        );
                    }
                }(window));
    </script>

    <!-- Tus estilos CSS (Bootstrap, personalizados, etc.) -->
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="PaginaPruebaUCSD_V2.styles.css" />
</head>

<body>
    <div id="app">
        <!-- Indicador de carga inicial de Blazor -->
        <div style="display: flex; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif;">
            <p>Cargando aplicación...</p>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <!-- Script para procesar la redirección de GitHub Pages SPA -->
    <script type="text/javascript">
            (function () {
                var segs = window.location.search.slice(1).split('&');
                for (var i = 0; i < segs.length; i++) {
                    var kv = segs[i].split('=');
                    if (kv[0] === '/' && kv[1]) {
                        var decoded = decodeURIComponent(kv[1]).replace(/~and~/g, '&');
                        window.history.replaceState(null, null,
                            window.location.pathname.slice(0, -1) + decoded + window.location.hash
                        );
                        break;
                    }
                }
            })();
    </script>

    <!-- Script principal de Blazor WebAssembly -->
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
